name: Download SimHub API DLLs
description: >
  Downloads the SimHub API DLLs from the private dependencies
  repo (latest release) into .\SimHub, so that the build uses the exact same
  DLLs as the local development build.

inputs:
  deps-pat:
    description: GitHub PAT with read access to the dependencies repo.
    required: true

runs:
  using: composite
  steps:
    - name: Download SimHub API DLLs
      shell: pwsh
      env:
        SIMHUB_DEPS_PAT: ${{ inputs.deps-pat }}
        SIMHUB_DEPS_REPO: pre-martin/SimHubPropertyServer-ci-deps
      run: |
        New-Item -ItemType Directory -Path SimHub -Force | Out-Null
        $headers = @{
          Authorization = "Bearer $env:SIMHUB_DEPS_PAT"
          Accept        = "application/vnd.github+json"
        }
        $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:SIMHUB_DEPS_REPO/releases/latest"
        $asset = $release.assets | Where-Object { $_.name -eq "simhub-dlls.zip" }
        $headers.Accept = "application/octet-stream"
        Invoke-WebRequest -Headers $headers -Uri $asset.url -OutFile simhub-dlls.zip
        Expand-Archive -Path simhub-dlls.zip -DestinationPath SimHub -Force
        Remove-Item simhub-dlls.zip
